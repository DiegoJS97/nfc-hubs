# Build the hubs with Eleventy and publish _site/ to GitHub Pages.
#
# Phase 1 is pure static output, so a static host is sufficient and GitHub Pages is where the
# repo already lives. wrangler.toml stays in the tree untouched: Cloudflare Pages remains the
# candidate for the phase that needs a server-side /r/<entry-id> redirector, which GitHub Pages
# cannot run (no serverless functions). That is a Phase 2 decision, not this one.
#
# BASE PATH. This repo deploys as a project page at https://<user>.github.io/<repo>/, and the
# hub layout's asset references are absolute. That is handled in the build, not here:
# scripts/lib/path-prefix.mjs holds the prefix, eleventy.config.js feeds it to the `url` filter,
# and tests/validation/path-prefix.spec.ts fails if any first-party reference loses it. The one
# thing this workflow adds is the check that the prefix still matches the repository's name -
# see "Verify the base path" below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets a deploy be re-run without an empty commit, e.g. after changing Pages settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a half-finished Pages
# deployment can leave the live site inconsistent - a queued run is cheaper than that.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Renaming the repository changes the Pages base path and silently breaks every asset
      # reference - the page still loads, just unstyled and without pending.js. Nothing in the
      # local suite can see that, because locally the prefix is true by definition: the builder
      # and the test server read the same constant. Only CI knows the real repository name.
      #
      # If this site ever moves to a custom domain or a user/org Pages repo, the correct prefix
      # becomes "/" - update scripts/lib/path-prefix.mjs and delete this step.
      #
      # REPO_NAME arrives through env rather than being interpolated into the script body:
      # Actions expands ${{ }} before bash runs, so a name containing a quote would otherwise be
      # a script-injection vector.
      - name: Verify the base path matches the repository name
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "scripts/lib/path-prefix.mjs";
            const source = fs.readFileSync(path, "utf8");
            const found = source.match(/PATH_PREFIX = "([^"]+)"/);
            if (!found) {
              console.error(`Could not find a PATH_PREFIX assignment in ${path}.`);
              console.error("This check reads the literal as text; if the declaration was reformatted, update the pattern here too.");
              process.exit(1);
            }
            const actual = found[1];
            const expected = `/${process.env.REPO_NAME}/`;
            if (actual !== expected) {
              console.error(`PATH_PREFIX is "${actual}" but this repo deploys under "${expected}".`);
              console.error("Update scripts/lib/path-prefix.mjs before deploying.");
              process.exit(1);
            }
            console.log(`base path OK: ${actual}`);
          '

      # Only the two browsers playwright.config.ts actually defines projects for.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The suite is the release gate, not a separate opinion about the code: it holds the
      # payload budget (SC-008), the WCAG 2.2 AA floor (SC-010), the first-party-only rule
      # (FR-022), the deployed base path, and the Phase 2 seam (T038). A hub that fails any of
      # those must not ship.
      - name: Test
        run: npm run test

      # tests/rebuild/ mutates business.json and rebuilds several times, restoring in a finally
      # block. Building again here means the uploaded artifact is unambiguously the real data,
      # rather than whatever the last rebuild inside a test happened to leave behind.
      - name: Build
        run: npm run build

      # Deliberately WITHOUT `static_site_generator: eleventy`. That option makes this action
      # inject its own path prefix via ELEVENTY_PATH_PREFIX, which would fight with the one in
      # eleventy.config.js. One source of truth for the prefix, and it is not this file.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
